[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vfoa"
version = "0.1.0"
description = "3D estimation of the Visual Focus of Attention (near-real-time pipeline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy",
    "opencv-python-headless",
    "pyyaml",
    "pillow",
]

[tool.setuptools.packages.find]
include = ["vfoa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "thesis_final"]
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "network: tests that need network access (run only when VFOA_RUN_NETWORK=1)",
]
