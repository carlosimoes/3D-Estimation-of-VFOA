# Synthetic profile: a deterministic scripted scene served by fake backends
# (no models, no weights). Used by tests and benchmarks.
profile: synthetic

input:
  source: synthetic
  path: synthetic
depth:
  backend: synthetic
persons:
  backend: synthetic
headpose:
  backend: synthetic
gaze:
  backend: synthetic
segmentation:
  backend: synthetic
  stride: 5

