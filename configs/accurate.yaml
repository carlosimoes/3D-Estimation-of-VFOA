# Accurate profile: the original thesis models (StereoBM depth, OpenPose + DensePose,
# FSA-Net, Gaze360, Panoptic FPN) with the improved attention algorithm.
# Needs the third-party checkouts: set models.third_party_root or VFOA_THIRD_PARTY.
profile: accurate

depth:
  backend: stereo_bm
persons:
  backend: openpose_densepose
headpose:
  backend: fsanet
gaze:
  backend: gaze360
segmentation:
  backend: panoptic_fpn
  stride: 1

