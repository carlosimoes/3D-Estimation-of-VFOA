# Fast real-time profile (the defaults): YOLO11-pose persons + keypoint head pose,
# YOLO11-seg segmentation every 10 frames, constant depth unless configured.
# Usage: python -m vfoa run --config configs/fast.yaml --input VIDEO
profile: fast

# Commented knobs (uncomment to change; see vfoa/config.py for every key):
# depth:
#   backend: stereo_bm        # stereo_bm|sintel_gt|constant|synthetic
#   stride: 1
# persons:
#   model: yolo11n-pose.pt
#   imgsz: 640
#   stride: 1
# gaze:
#   backend: none             # gaze360|head_proxy|synthetic|none
# segmentation:
#   stride: 10
#   async: false
# attention:
#   sigma_gaze_deg: 10.0
#   sigma_head_deg: 20.0
# models:
#   device: auto              # auto|cpu|cuda|cuda:0
#   weights_dir: weights
